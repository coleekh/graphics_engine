[package]
name = "graphics_engine"
version = "0.1.0"
edition = "2021"
description = "A modular 3D graphics engine built with wgpu and winit"
authors = ["Cole Hoeppner"]

[[bin]]
name = "graphics_engine"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", features = ["rwh_05"] }
wgpu = { version = "0.20" }
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
glam = { version = "0.32", features = ["bytemuck"] }
pollster = "0.3"
raw-window-handle = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
