[package]
name = "graphics_engine"
version = "0.1.0"
edition = "2021"
description = "A modular 3D graphics engine built with wgpu and winit"
authors = ["Your Name"]

[[bin]]
name = "graphics_engine"
path = "src/main.rs"

[dependencies]
# Windowing and input
winit = { version = "0.30", features = ["rwh_05"] }

# GPU abstraction (WebGPU-based)
wgpu = { version = "0.20" }

# Safe byte casting for GPU buffers
bytemuck = { version = "1.14", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Image loading (textures)
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }

# Math library (vectors, matrices, quaternions)
glam = { version = "0.32", features = ["bytemuck"] }

# Async runtime (required by wgpu)
pollster = "0.3"

# Window-surface integration
raw-window-handle = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
